# nginx de la imagen web: archivos estáticos de la app + proxy al backend.
# "backend" es el nombre del servicio en docker-compose.yml (y del Service en k8s/).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Cabeceras de seguridad básicas (también las revisa el escaneo DAST)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  # HTTPS lo pone Tailscale Funnel delante de nginx; el navegador recuerda usar solo HTTPS.
  add_header Strict-Transport-Security "max-age=31536000" always;
  # Express anuncia "X-Powered-By: Express"; no se le dice al cliente qué tecnología hay detrás.
  proxy_hide_header X-Powered-By;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO (tiempo real): necesita el upgrade a WebSocket
  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Recursos con hash en el nombre: se pueden guardar en caché mucho tiempo
  # (expires y no add_header: un add_header aquí anularía las cabeceras de seguridad de arriba)
  location /_expo/ {
    expires 30d;
  }

  # La app es de una sola página: toda ruta desconocida carga index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
