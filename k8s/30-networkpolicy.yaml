# NetworkPolicy: el backend solo acepta conexiones de los pods web.
# Por qué: el backend tiene /metrics y la API completa; si otro pod del clúster (o un contenedor
# comprometido) pudiera hablarle directo, se saltaría nginx y sus cabeceras de seguridad.
# Mismo principio que en Compose, donde el puerto 3000 solo escucha en 127.0.0.1.
# El pipeline (k8s.yml) comprueba que un pod sin la etiqueta "web" NO llega al backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: denegar-todo-el-ingreso
  namespace: asistec
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-solo-desde-web
  namespace: asistec
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: web }
      ports:
        - { port: 3000, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-desde-cualquier-origen
  namespace: asistec
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: web }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8080, protocol: TCP }
