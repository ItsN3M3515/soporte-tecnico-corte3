# PLANTILLA del Secret que usan los Deployments. Está en una subcarpeta para que
# `kubectl apply -f k8s/` (que no es recursivo) no la aplique con el valor de ejemplo.
# El pipeline (k8s.yml) y la guía crean el Secret real con un valor aleatorio:
#
#   kubectl -n asistec create secret generic asistec-secretos \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: asistec-secretos
  namespace: asistec
type: Opaque
stringData:
  JWT_SECRET: "<generar con: openssl rand -hex 32>"
