# Dependabot mantiene las dependencias al día con pull requests semanales.
# No reemplaza el control de SCA (scripts/sca.sh): cada PR de Dependabot pasa por el mismo pipeline
# y, como cualquier otro, necesita la aprobación de un integrante (ruleset proteger-main).
#
# Agrupado: un PR por área (app, backend, herramientas de desarrollo, imágenes, actions) en lugar
# de uno por librería, para que cada semana haya pocos PR que revisar.
# Versiones mayores ignoradas hasta después de la entrega (rompen la API o cambian el runtime):
#   Node (imagen base) 22 → 26 y Express 4 → 5. Expo, React y React Native: nunca por Dependabot (ver app).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend:
        dependency-type: production
        update-types: [minor, patch]
      backend-dev:
        dependency-type: development
        update-types: [minor, patch]
      backend-seguridad:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: express
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      app:
        patterns: ["*"]
        update-types: [minor, patch]
      app-seguridad:
        applies-to: security-updates
        patterns: ["*"]
    # Expo fija la versión exacta de React, React Native y sus módulos para cada SDK. Dependabot no
    # lo sabe: el 2026-11-06 propuso React 19.3.1 y reanimated 4.5.5 (PR #21) y `expo install --check`
    # los marcó como incompatibles con el SDK 57. Esos paquetes se actualizan solo con
    # `npx expo install --fix` (y el job Construcción falla si quedan desalineados).
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"

  - package-ecosystem: docker
    directories: [/backend, /app]
    schedule: { interval: weekly }
    groups:
      imagenes-base:
        patterns: ["*"]
    # Node 22 es LTS y trae node:sqlite estable (engines >=22.13); un cambio de versión mayor se prueba aparte.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
